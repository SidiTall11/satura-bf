services:
  - type: web
    name: sutura-bf
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: node --check server.js && node --check script.js && node --check dashboard.js
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUTURA_DEMO_TOKEN
        generateValue: true
